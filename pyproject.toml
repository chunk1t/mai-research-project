[project]
name = "ragrobust"
version = "0.1.0"
description = "Benchmarking RAG robustness under imperfect retrieval across naive, reasoning, and agentic pipelines"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "rank-bm25>=0.2.2",
    "numpy>=1.24",
    "datasets>=2.14",
    "sentence-transformers>=3.0",
    "transformers>=4.40",
    "scikit-learn>=1.3",
    "tenacity>=8.2",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]
# Chapter 7 figures: the NDC per class, the CRS distribution, and the
# Refusal F1 precision/recall decomposition (P1 Section 5.7).
analysis = ["matplotlib>=3.8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
